# KiCadD Windows x64 build (M3): upstream KiCad at patches/UPSTREAM_BASE + KiCadD patches,
# MSVC + Ninja + vcpkg manifest, lean switches (no OpenCASCADE / ngspice / Python).
#
# deps and build are separate jobs because each GitHub job is capped at 6 h and a cold
# dependency build plus KiCad can exceed that:
#   deps     builds the vcpkg dependencies into a binary cache (saved even when it fails part way,
#            so a re-run continues where it stopped)
#   build    restores that cache, builds KiCadD, runs the smoke test, uploads a portable zip
#   release  tags v* only: zips that artifact and publishes a GitHub release
#            (a tag with a "-", e.g. v0.1.0-alpha.2, is marked as a pre-release)
#
# Two build modes:
#   check    (push / PR / manual): sccache, no PCH (sccache can't cache MSVC /Yu), no debug info;
#            the sccache folder is one actions/cache entry (older ones are pruned). It answers
#            "does Windows still build", fast when few files changed.
#   release  (tags v*): clean build, PCH on, /Zi, the PDBs go out with the release.
# Pushes that touch only docs or Linux-only tests don't build (tags always do).
name: windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'src/**'
      - 'mcp/**'
      - 'proto/**'
      - 'web/**'
      - 'cmake/**'
      - 'patches/**'
      - 'ci/**'
      - 'client/smoke.py'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'mcp/**'
      - 'proto/**'
      - 'web/**'
      - 'cmake/**'
      - 'patches/**'
      - 'ci/**'
      - 'client/smoke.py'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
  VCPKG_DISABLE_METRICS: 1

jobs:
  deps:
    runs-on: windows-2022
    timeout-minutes: 350
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: kicadd
      - name: Upstream KiCad + KiCadD patches
        shell: bash
        run: kicadd/ci/fetch_upstream.sh kicad
      - name: Cache key
        id: key
        shell: bash
        run: echo "key=vcpkg-win-x64-${{ hashFiles('kicad/vcpkg.json', 'kicad/vcpkg-configuration.json', 'kicadd/ci/vcpkg-triplets/*') }}" >> "$GITHUB_OUTPUT"
      - name: vcpkg at the manifest baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline=$(python -c "import json; print(json.load(open('kicad/vcpkg-configuration.json'))['default-registry']['baseline'])")
          git init -q vcpkg
          git -C vcpkg fetch -q --depth 1 https://github.com/microsoft/vcpkg "$baseline"
          git -C vcpkg checkout -q FETCH_HEAD
          # vcpkg.exe through the API with the job token: anonymous release downloads (what
          # bootstrap-vcpkg.bat does) can time out when GitHub throttles anonymous traffic
          tag=$(sed -n 's/^VCPKG_TOOL_RELEASE_TAG=//p' vcpkg/scripts/vcpkg-tool-metadata.txt | tr -d '\r')
          for i in 1 2 3; do
            gh release download "$tag" -R microsoft/vcpkg-tool -p vcpkg.exe -D vcpkg --clobber && break
            sleep 20
          done
          [ -f vcpkg/vcpkg.exe ] || vcpkg/bootstrap-vcpkg.bat -disableMetrics
          vcpkg/vcpkg.exe version | head -1
      - uses: actions/cache/restore@v4
        with:
          path: vcpkg-bincache
          key: ${{ steps.key.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.key.outputs.key }}-
            vcpkg-win-x64-
      - name: "vcpkg install (lean: no OpenCASCADE, ngspice, Python)"
        id: install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null
          $before = (Get-ChildItem -Recurse -File vcpkg-bincache).Count
          try {
            & "$env:VCPKG_ROOT\vcpkg.exe" install `
              --x-manifest-root=kicad --x-install-root=vcpkg_installed `
              --overlay-triplets=kicadd/ci/vcpkg-triplets `
              --triplet=x64-windows --host-triplet=x64-windows `
              --x-no-default-features --x-abi-tools-use-exact-versions --clean-after-build
            if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }
          } finally {
            $after = (Get-ChildItem -Recurse -File vcpkg-bincache).Count
            "new=$($after - $before)" >> $env:GITHUB_OUTPUT
            Write-Host "binary cache: $before -> $after packages"
          }
      - name: Show vcpkg logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse vcpkg/buildtrees -Filter *.log -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 6 |
            ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
      - uses: actions/cache/save@v4
        if: always() && steps.install.outputs.new != '0' && steps.install.outputs.new != ''
        with:
          path: vcpkg-bincache
          key: ${{ steps.key.outputs.key }}-${{ github.run_id }}

  build:
    needs: deps
    runs-on: windows-2022
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write            # prune old sccache entries
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      SCCACHE_DIR: ${{ github.workspace }}\sccache
      SCCACHE_CACHE_SIZE: 4G
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: kicadd
      - name: Upstream KiCad + KiCadD patches
        shell: bash
        run: kicadd/ci/fetch_upstream.sh kicad
      - name: vcpkg at the manifest baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline=$(python -c "import json; print(json.load(open('kicad/vcpkg-configuration.json'))['default-registry']['baseline'])")
          git init -q vcpkg
          git -C vcpkg fetch -q --depth 1 https://github.com/microsoft/vcpkg "$baseline"
          git -C vcpkg checkout -q FETCH_HEAD
          # vcpkg.exe through the API with the job token: anonymous release downloads (what
          # bootstrap-vcpkg.bat does) can time out when GitHub throttles anonymous traffic
          tag=$(sed -n 's/^VCPKG_TOOL_RELEASE_TAG=//p' vcpkg/scripts/vcpkg-tool-metadata.txt | tr -d '\r')
          for i in 1 2 3; do
            gh release download "$tag" -R microsoft/vcpkg-tool -p vcpkg.exe -D vcpkg --clobber && break
            sleep 20
          done
          [ -f vcpkg/vcpkg.exe ] || vcpkg/bootstrap-vcpkg.bat -disableMetrics
          vcpkg/vcpkg.exe version | head -1
      - uses: actions/cache/restore@v4
        with:
          path: vcpkg-bincache
          key: ${{ needs.deps.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ needs.deps.outputs.key }}-
          fail-on-cache-miss: true
      - name: vcpkg install (from the binary cache)
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --x-manifest-root=kicad --x-install-root=vcpkg_installed `
            --overlay-triplets=kicadd/ci/vcpkg-triplets `
            --triplet=x64-windows --host-triplet=x64-windows `
            --x-no-default-features --x-abi-tools-use-exact-versions --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: sccache (check builds)
        if: env.RELEASE != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.19.0 -R mozilla/sccache -p 'sccache-v0.19.0-x86_64-pc-windows-msvc.zip' -D "$RUNNER_TEMP"
          unzip -q -j "$RUNNER_TEMP/sccache-v0.19.0-x86_64-pc-windows-msvc.zip" '*/sccache.exe' -d "$RUNNER_TEMP/sccache-bin"
          echo "$RUNNER_TEMP/sccache-bin" >> "$GITHUB_PATH"
      - name: Restore the sccache folder
        if: env.RELEASE != 'true'
        uses: actions/cache/restore@v4
        with:
          path: sccache
          key: sccache-win-${{ needs.deps.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            sccache-win-${{ needs.deps.outputs.key }}-
            sccache-win-
      - name: Configure
        id: configure
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE -replace '\\', '/'
          if ($env:RELEASE -eq 'true') {
            # clean build with PDBs (/Zi), precompiled headers on
            $mode = @("-DKICADD_MSVC_DEBUG_FORMAT=ProgramDatabase", "-DKICAD_USE_PCH=ON")
          } else {
            $mode = @("-DCMAKE_C_COMPILER_LAUNCHER=sccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache",
                      "-DKICADD_MSVC_DEBUG_FORMAT=", "-DKICAD_USE_PCH=OFF")
          }
          "build mode: $(if ($env:RELEASE -eq 'true') {'release'} else {'check (sccache)'}) $mode"
          cmake -S kicad -B build -G Ninja @mode `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$ws/dist" `
            -DCMAKE_TOOLCHAIN_FILE="$ws/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_INSTALL=OFF `
            -DVCPKG_INSTALLED_DIR="$ws/vcpkg_installed" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_OVERLAY_TRIPLETS="$ws/kicadd/ci/vcpkg-triplets" `
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON `
            -DKICADD_DIR="$ws/kicadd" `
            -DKICADD_NO_OCC=ON -DKICADD_NO_SPICE=ON -DKICADD_NO_PYTHON=ON `
            -DKICAD_BUILD_QA_TESTS=OFF -DKICAD_BUILD_I18N=OFF `
            -DKICAD_UPDATE_CHECK=OFF -DKICAD_USE_SENTRY=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        shell: pwsh
        run: |
          # -k 0: keep going, so one run shows every compile error
          cmake --build build -- -k 0
          $rc = $LASTEXITCODE
          if ($env:RELEASE -ne 'true') { sccache --show-stats; sccache --stop-server | Out-Null }
          if ($rc -ne 0) { exit $rc }
      - name: Save the sccache folder
        if: always() && env.RELEASE != 'true' && steps.configure.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: sccache
          key: sccache-win-${{ needs.deps.outputs.key }}-${{ github.run_id }}
      - name: Prune older sccache entries
        if: always() && env.RELEASE != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: sccache-win-${{ needs.deps.outputs.key }}-${{ github.run_id }}
        run: |
          # one sccache entry (~1 GB) is enough; keep the 10 GB repo quota for the vcpkg cache
          gh cache list -R "$GITHUB_REPOSITORY" --key sccache-win- --limit 100 --json key --jq '.[].key' |
            while read -r k; do
              [ "$k" = "$KEEP" ] || gh cache delete "$k" -R "$GITHUB_REPOSITORY" || true
            done
      - name: Install (portable folder)
        shell: pwsh
        run: |
          # the prefix is set at configure time: on Windows KICAD_DATA (share/kicad: icons,
          # templates, schemas) is an absolute path baked from CMAKE_INSTALL_PREFIX, so
          # --prefix here would relocate bin/ but leave share/ in C:/Program Files (x86)
          cmake --install build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/kicadd-mcp.exe dist/bin/ -ErrorAction SilentlyContinue
          if (-not (Test-Path dist/bin/kicadd-mcp.exe)) {
            Get-ChildItem -Recurse build -Filter kicadd-mcp.exe | Select-Object -First 1 | Copy-Item -Destination dist/bin/
          }
          # vcpkg runtime DLLs next to the executables
          Copy-Item vcpkg_installed/x64-windows/bin/*.dll dist/bin/ -Force
          "{0:N0} MB in dist" -f ((Get-ChildItem -Recurse -File dist | Measure-Object Length -Sum).Sum / 1MB)
      - name: Smoke test
        shell: pwsh
        run: |
          python -I kicadd/client/smoke.py --bin dist/bin --demos kicad/demos --work "$env:RUNNER_TEMP/smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: kicadd-windows-x64
          path: dist
          retention-days: 14
      - name: Collect PDBs (release)
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pdb | Out-Null
          # the link PDB next to each shipped binary (compile PDBs share names, not needed)
          Get-ChildItem -Recurse build -Include *.exe, *.dll |
            ForEach-Object { Join-Path $_.DirectoryName ($_.BaseName + '.pdb') } |
            Where-Object { Test-Path $_ } |
            Copy-Item -Destination pdb -Force
          "{0} PDBs, {1:N0} MB" -f (Get-ChildItem pdb).Count, ((Get-ChildItem pdb | Measure-Object Length -Sum).Sum / 1MB)
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: kicadd-windows-x64-pdb
          path: pdb
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kicadd-windows-x64
          path: kicadd-windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: kicadd-windows-x64-pdb
          path: kicadd-windows-x64-pdb
      - name: Zip and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          # the recommended way for an agent to use the tools (skills/kicadd): in the zip, and
          # on its own for Claude Desktop (Settings > Capabilities > Skills takes a zip)
          mkdir -p kicadd-windows-x64/share/kicadd/skills
          cp -r skills/kicadd kicadd-windows-x64/share/kicadd/skills/
          (cd skills && zip -qr -9 ../kicadd-skill.zip kicadd)
          zip -qr -9 kicadd-windows-x64.zip kicadd-windows-x64
          sha=$(sha256sum kicadd-windows-x64.zip | cut -d' ' -f1)
          # debug symbols for crash reports, as a separate asset (release assets max out at 2 GiB)
          zip -qr -9 kicadd-windows-x64-pdb.zip kicadd-windows-x64-pdb
          assets=(kicadd-windows-x64.zip kicadd-skill.zip)
          if [ "$(stat -c %s kicadd-windows-x64-pdb.zip)" -lt 2000000000 ]; then
            assets+=(kicadd-windows-x64-pdb.zip)
          else
            echo "::warning::PDB zip is over 2 GB, not attached (it stays a workflow artifact for 14 days)"
          fi
          read -r up_sha up_date _ < patches/UPSTREAM_BASE
          {
            sed -e '/^<!--/,/-->$/d' -e "s/{{UPSTREAM}}/\`${up_sha:0:8}\`，${up_date}/" ci/release-notes.md
            echo
            echo '---'
            echo "建置：commit \`${GITHUB_SHA:0:7}\`，CI run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})  "
            echo "\`kicadd-windows-x64.zip\` SHA-256：\`${sha}\`"
          } > notes.md
          cat notes.md
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" "${assets[@]}" $pre --verify-tag \
            --title "KiCadD ${TAG}（Windows x64 修剪版）" --notes-file notes.md
