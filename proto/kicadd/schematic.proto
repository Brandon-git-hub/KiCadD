// KiCadD M5a: schematic generation for agents.
//
// Served by KICADD_HANDLER_SCH next to KiCad's own schematic handler, on the schematic the
// api-server (or the Schematic Editor) has open. Coordinates are mm on the sheet, Y down,
// snapped to the 1.27 mm (50 mil) connection grid. A connection is a short wire stub from the
// pin plus a net label, so nothing has to be routed and every net is named. Each edit request
// is one commit.
//
// This file is part of KiCadD and is licensed GPL-3.0-or-later, like KiCad.

syntax = "proto3";

package kicadd.schematic;

message SchPin
{
  string number = 1;
  string name   = 2;
  string type   = 3;       // input, output, bidirectional, power_in, passive, ...
  double x      = 4;       // connection point, mm
  double y      = 5;
  string side   = 6;       // where a wire leaves it: left, right, up, down
  string net    = 7;       // "" when not connected yet
  int32  unit   = 8;
}

message SchSymbol
{
  string ref       = 1;
  string value     = 2;
  string lib_id    = 3;
  string footprint = 4;
  double x         = 5;    // anchor, mm
  double y         = 6;
  int32  rotation  = 7;    // degrees
  int32  unit      = 8;
  int32  units     = 9;    // units the part has
  string lcsc      = 10;
  repeated SchPin pins = 11;
  string sheet     = 12;   // the sheet it is on: "/" (root), "/Power/"
  map<string, string> fields = 13;   // with pins only: the user fields (LCSC aside) and Datasheet / Description when set
  repeated string attributes = 14;   // with pins only: dnp, exclude_from_bom, exclude_from_board, exclude_from_sim, exclude_from_pos
}

// A hierarchical sheet: its symbol on the parent sheet, its own file, its pins (one per port of
// the sheet: a hierarchical label inside, a sheet pin on the symbol outside)
message SchSheetPin
{
  string name      = 1;
  string direction = 2;    // input, output, bidirectional, tri_state, passive
  string side      = 3;    // where a wire leaves it on the parent: left, right
  string net       = 4;    // its net on the parent sheet ("" when not connected there)
  double x         = 5;
  double y         = 6;
}

message SchSheet
{
  string name   = 1;
  string file   = 2;       // relative to the project
  string path   = 3;       // "/Power/"
  string parent = 4;       // "/"
  double x      = 5;       // the sheet symbol on the parent, mm
  double y      = 6;
  double width  = 7;
  double height = 8;
  int32  parts  = 9;       // symbols on it (power symbols aside)
  repeated SchSheetPin pins = 10;
}

// Add a hierarchical sheet (a new file) on a parent sheet.
// Returns SchSheetResponse
message SchAddSheet
{
  string name   = 1;       // "Power": unique among its siblings
  string file   = 2;       // default "<name>.kicad_sch" next to the root schematic
  string parent = 3;       // sheet name or path; default the root
  optional double x = 4;   // the sheet symbol's top left, mm; default the next free spot
  optional double y = 5;
  double width  = 6;       // mm (default 50.8)
  double height = 7;       // mm (default 25.4; grows with its pins)
}

message SchSheetResponse
{
  SchSheet sheet = 1;
  string   note  = 2;
}

// Returns SchSummary
message GetSchSummary
{
  bool with_pins = 1;
}

message SchSummary
{
  string file             = 1;
  int32  sheets           = 2;
  int32  nets             = 3;
  int32  unconnected_pins = 4;   // pins on no named net and not marked no-connect
  repeated SchSymbol symbols = 5;
  repeated SchSheet sheet_list = 6;   // the hierarchical sheets (root aside)
}

// Place a symbol: from a library (lib_id "Device:R") or an LCSC part (lcsc "C25804": fetched,
// symbol + footprint into the project's LCSC libraries). Without x/y it goes to the next free
// slot on the sheet. ref "R?" (or empty) is annotated; "R5" is taken as is.
// Returns SchPartResponse
message SchAddPart
{
  string lib_id    = 1;
  string lcsc      = 2;
  string ref       = 3;
  string value     = 4;    // overrides the library's Value
  string footprint = 5;    // overrides the library's Footprint
  optional double x = 6;
  optional double y = 7;
  int32  rotation  = 8;    // 0, 90, 180, 270
  int32  unit      = 9;    // multi-unit parts: which unit (default 1)
  string block     = 10;   // functional block ("LDO", "MCU"): a hidden "Block" field; auto_place keeps blocks together
  string sheet     = 11;   // the sheet to put it on (name or path, "Power" or "/Power/"); default the root
}

// Returns SchPartResponse
message SchGetPart
{
  string ref = 1;
}

message SchPartResponse
{
  SchSymbol symbol = 1;
  string    note   = 2;
}

message SchPinNet
{
  string ref = 1;
  string pin = 2;          // pin number ("1", "A3") or a unique pin name ("VDD"); for a sheet pin
                           // ref is the sheet's name and pin the sheet pin's ("Power", "VOUT")
  string net = 3;          // net name; "NC" puts a no-connect flag instead
}

// Connect pins to nets: wire stub + label (global label with `global`). A pin that already has
// a different net is refused (disconnect it first); the same net again is a no-op.
// Returns SchConnectResponse
message SchConnect
{
  repeated SchPinNet links = 1;
  bool global = 2;
  // Nets connected with a power symbol at the stub end instead of a label ("GND", "+3V3"):
  // global across sheets, as in KiCad. Ground-like names get a ground symbol.
  repeated string power = 4;
  // Nets that are ports of the pins' sheet: a hierarchical label inside instead of a local one,
  // and a sheet pin of the same name on the sheet's symbol on the parent ("VOUT" or
  // "VOUT:output"; directions input, output, bidirectional, tri_state, passive)
  repeated string ports = 3;
}

// Take the stub/label/no-connect off pins (net ignored).
// Returns SchConnectResponse
message SchDisconnect
{
  repeated SchPinNet pins = 1;
}

message SchConnectResponse
{
  int32 done = 1;
  repeated string errors = 2;
  string history_label = 3;
}

// Returns SchNetlist
message GetSchNetlist
{
  string net = 1;          // only this net ("" = all)
}

message SchNet
{
  string name = 1;
  repeated string pins = 2;   // "R1.2"
}

message SchNetlist
{
  repeated SchNet nets        = 1;
  repeated string unconnected = 2;   // "U1.7": on no net, no no-connect flag
  repeated string no_connect  = 3;   // on no net, marked no-connect (X) on purpose
}

// Returns SchConnectResponse (done = parts deleted, with their stubs and labels; a sheet's name
// deletes the sheet with everything on it, its file stays on disk)
// refs: parts or sheets. wires: a point on a wire deletes that wire (all its segments through
// bends, up to where it meets a pin, junction, label or another wire); labels and junctions left
// on nothing go with it. dangling: also every wire with an end on nothing. sheet: for wires /
// dangling ("" = the root sheet).
message SchDeleteParts
{
  repeated string refs = 1;
  repeated SchPoint wires = 2;
  bool dangling = 3;
  string sheet = 4;
}

// Returns SchConnectResponse
message SchSave
{
  bool only_headless = 1;   // in the Schematic Editor do nothing (the file is the user's; sync_pcb reads the editor)
}

// Move and/or rotate a placed part. Its stubs, net labels and no-connect flags go with it (a
// stub is re-drawn on the side the pin now faces); other wires ending on a pin are dragged
// along (they may end up diagonal). unit 0 = every unit of the part (only with dx/dy).
// Returns SchPartResponse (the part at its new place, with its pins)
message SchMove
{
  string ref               = 1;
  int32  unit              = 2;
  optional double x        = 3;   // new anchor, mm (snapped to the 1.27 mm grid)
  optional double y        = 4;
  double dx                = 5;   // or relative, mm
  double dy                = 6;
  optional int32 rotation  = 7;   // new rotation: 0, 90, 180, 270
}

message SchPoint
{
  double x = 1;   // mm
  double y = 2;
}

// Draw a wire through points (mm, snapped to the grid): one segment per pair. A point on a pin,
// a label, a wire end or the middle of a wire connects there (junction dots added where three
// or more wires meet, a wire it lands on is split). sheet as in SchAddPart.
// Returns SchWireResponse
message SchWire
{
  repeated SchPoint points = 1;
  string sheet             = 2;
}

message SchWireResponse
{
  int32  segments  = 1;
  int32  junctions = 2;
  string net       = 3;   // the net the wire is on afterwards ("" when on none)
  repeated string pins = 4;   // pins on that net, "R1.2"
  string history_label = 5;
  string note      = 6;
}

// Run the Electrical Rules Check on the schematic as it is in memory (unsaved edits included).
// Returns SchErcResponse
message SchRunErc
{
  bool include_warnings = 1;   // default: errors only (warnings counted)
}

message SchErcViolation
{
  string severity    = 1;   // error, warning
  string type        = 2;   // ERC key, e.g. pin_not_driven
  string description = 3;
  repeated string items = 4;   // "Symbol U1 Pin 3 [VCC, Power input, Line]"
  string sheet       = 5;
  double x           = 6;   // mm, the first item
  double y           = 7;
}

message SchErcResponse
{
  int32 errors   = 1;
  int32 warnings = 2;
  repeated SchErcViolation violations = 3;
  repeated string ignored = 4;   // checks set to ignore in the project's ERC settings
}

// Add a library that is already on disk to the project's library table: a symbol library
// (.kicad_sym) to sym-lib-table, a footprint library (.pretty directory) to fp-lib-table.
// path absolute or relative to the project (stored as ${KIPRJMOD}/... when inside it).
// Returns RegisterLibraryResponse
message RegisterLibrary
{
  string path     = 1;
  string nickname = 2;   // default: the file / directory name without extension
}

message RegisterLibraryResponse
{
  string nickname = 1;
  string table    = 2;   // sym-lib-table or fp-lib-table
  string uri      = 3;
  bool   added    = 4;   // false: a row of that name was there already (same uri: nothing to do)
  int32  items    = 5;   // symbols / footprints in it
  string note     = 6;
}

// Design review by rules, for the agent to judge: decoupling (IC power pins with a capacitor to
// ground on the same net), power (every supply net has a source), ESD (connector nets with a
// TVS / ESD part), and nets with one pin only. Not a sign-off: findings to look at.
// Returns SchAuditResponse
message SchAudit
{
}

message SchAuditFinding
{
  string category = 1;   // decoupling, power, esd, net
  string severity = 2;   // warning, info
  string message  = 3;
  repeated string refs = 4;
}

// An IC power pin and a capacitor that decouples it (same net, other side on ground)
message SchDecapPair
{
  string ic      = 1;    // "U1.14"
  string net     = 2;
  string cap     = 3;    // "C3.1": its pin on that net
}

message SchAuditResponse
{
  repeated SchAuditFinding findings = 1;
  repeated SchDecapPair    decaps   = 2;
  int32 ics        = 3;
  int32 power_nets = 4;
  int32 connectors = 5;
}

// A box symbol from a pin list, saved to the project library "kicadd" (kicadd.kicad_sym next to
// the project, added to sym-lib-table on first use). Then sch_add_part lib_id "kicadd:<name>".
// Returns SchCreateSymbolResponse
message SchSymbolPin
{
  string number = 1;
  string name   = 2;
  string type   = 3;   // input, output, bidirectional, tri_state, passive, power_in, power_out,
                       // open_collector, open_emitter, no_connect, unspecified (default passive)
  string side   = 4;   // left, right, top, bottom (default: inputs and power_in left, the rest right)
  bool   hidden = 5;
}

message SchCreateSymbol
{
  string name        = 1;   // the symbol's name in the library
  string reference   = 2;   // prefix, default "U"
  string value       = 3;   // default the name
  string footprint   = 4;   // "Library:Footprint"
  string datasheet   = 5;
  string description = 6;
  string keywords    = 7;
  repeated SchSymbolPin pins = 8;
  bool   replace     = 9;   // overwrite a symbol of that name
  string lcsc        = 10;  // an LCSC field
}

message SchCreateSymbolResponse
{
  string lib_id  = 1;       // "kicadd:<name>"
  string file    = 2;
  int32  pins    = 3;
  double width   = 4;       // body, mm
  double height  = 5;
  bool   registered = 6;    // the library was added to sym-lib-table now
  string note    = 7;
}

// The agent's own schematic history: undo / redo its last edit (not the user's). Items changed
// since (by the user) are left as they are and counted; an edit the user already undid in the
// editor (Ctrl+Z) is said so and moved over. Returns SchHistoryResponse
message SchUndo
{
  bool redo = 1;
}

message SchHistoryResponse
{
  bool   ok          = 1;   // something was undone / redone
  string label       = 2;   // the edit ("add R3", "connect 4 pin(s)")
  int32  items       = 3;   // items put back as they were
  int32  changed     = 4;   // items changed since, left as they are
  int32  already     = 5;   // items already as they were (the editor's undo did it)
  int32  undo_size   = 6;
  int32  redo_size   = 7;
  string next_undo   = 8;
}

// Change parts' fields and attributes as one edit (all units of a part; sch_undo takes it back).
// fields: name -> text; "Value", "Footprint", "Datasheet", "Description" are the symbol's own
// fields (any case), other names are user fields, added (hidden) when missing. remove: user
// fields to delete. sync_pcb carries the changes to the board. Returns SchConnectResponse
message SchFieldEdit
{
  string              ref    = 1;
  map<string, string> fields = 2;
  repeated string     remove = 3;
  optional bool dnp                 = 4;
  optional bool exclude_from_bom    = 5;
  optional bool exclude_from_board  = 6;
  optional bool exclude_from_sim    = 7;
  optional bool exclude_from_pos    = 8;
}

message SchSetFields
{
  repeated SchFieldEdit parts = 1;
}

// A picture (PNG) of one sheet of the schematic in memory, for the agent to look at: KiCad's own
// plot (symbols, wires, labels, fields), with what to look at marked: parts framed and
// labelled, nets drawn bright, a millimetre ruler on the top and left (the coordinates the
// other tools use). Returns SchRenderResponse
message SchRender
{
  string          sheet  = 1;   // name or path; default: the sheet of the first ref, else the root
  repeated string refs   = 2;   // framed
  repeated string nets   = 3;   // drawn bright (on this sheet)
  repeated double area   = 4;   // [x0, y0, x1, y1] mm
  bool            zoom   = 5;   // to the refs / nets (with a margin)
  int32           size   = 6;   // pixels on the long side (default 1600, 200..4000)
  bool            frame  = 7;   // the whole page with its frame and title block
  string          path   = 8;   // also write the PNG there
  double          margin = 9;   // mm around a zoom (default 5)
}

message SchRenderResponse
{
  bytes  png       = 1;
  int32  width     = 2;
  int32  height    = 3;
  double mm_per_px = 4;
  repeated double area = 5;      // [x0, y0, x1, y1] mm drawn (without the ruler strips)
  string sheet     = 6;          // its path ("/", "/Power/")
  repeated string missing   = 7; // refs / nets not found anywhere
  repeated string elsewhere = 8; // "U5 on /Power/", "net VBUS not on this sheet"
  string path      = 9;
}
