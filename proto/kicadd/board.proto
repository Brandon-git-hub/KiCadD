/*
 * KiCadD compact board API.
 *
 * Design goals (see KiCadD/README.md):
 *  - Spatially scoped queries instead of whole-board dumps.
 *  - Human/LLM-friendly handles: footprints are addressed by reference designator,
 *    other items by a short id (first 8 hex chars of the KIID).
 *  - All coordinates are integer nanometres (KiCad internal units), rotations in
 *    tenths of a degree, so messages stay small and lossless.
 *
 * This file is part of KiCadD and is licensed GPL-3.0-or-later, like KiCad.
 */

syntax = "proto3";

package kicadd.board;

// ---------------------------------------------------------------------------
// Common types

message Point
{
  int64 x = 1;
  int64 y = 2;
}

enum ItemKind
{
  IK_UNKNOWN   = 0;
  IK_FOOTPRINT = 1;
  IK_PAD       = 2;
  IK_TRACK     = 3;
  IK_ARC       = 4;
  IK_VIA       = 5;
  IK_ZONE      = 6;
  IK_SHAPE     = 7;
  IK_TEXT      = 8;
}

// A deliberately small description of a board item.
message CompactItem
{
  ItemKind kind  = 1;
  string   handle = 2;   // "R12" for footprints, "R12.3" for pads, short KIID otherwise
  string   net   = 3;    // empty when unconnected / not applicable
  string   layer = 4;    // canonical layer name, e.g. "F.Cu"; empty for multi-layer
  Point    pos   = 5;    // anchor / start point
  Point    end   = 6;    // segment end (tracks/arcs only)
  int64    width = 7;    // track width or via diameter, 0 if n/a
  int32    rot_decideg = 8;  // footprint rotation
  int64    dist  = 9;    // distance from query center (nm)
  string   id    = 10;   // full KIID, only when the query sets with_ids
  Point    size  = 11;   // footprints: body bounding-box width/height (no text)
}

// ---------------------------------------------------------------------------
// Commands

// Returns BoardSummaryResponse
message GetBoardSummary {}

message BoardSummaryResponse
{
  string file       = 1;
  int32  footprints = 2;
  int32  tracks     = 3;
  int32  vias       = 4;
  int32  zones      = 5;
  int32  nets       = 6;
  int32  copper_layers = 7;
  Point  bbox_min   = 8;
  Point  bbox_max   = 9;
  repeated string duplicate_refs = 10;   // "R22 x2": a reference on more than one footprint
}

// Items whose bounding box intersects a circle.
// Center is either an explicit point or the position of a footprint (by reference).
// Returns QueryResponse
message QueryRadius
{
  oneof center
  {
    Point  point     = 1;
    string reference = 2;
  }
  int64             radius   = 3;   // nm
  repeated ItemKind kinds    = 4;   // empty = footprints, tracks, vias, pads
  int32             limit    = 5;   // 0 = default (64)
  bool              with_ids = 6;   // also return full KIIDs (costs tokens; for tooling)
}

// Topology of a single net: pads, tracks and vias on it.
// Returns QueryResponse
message QueryNet
{
  string net   = 1;
  int32  limit = 2;   // 0 = default (256)
}

message QueryResponse
{
  repeated CompactItem items     = 1;
  int32                total     = 2;  // total matches before limit was applied
  bool                 truncated = 3;
}

// Relative move/rotate/flip of footprints, addressed by reference designator.
// The whole request is applied as a single undoable commit, in the order move, rotate, flip.
// Returns MoveResponse
message MoveDelta
{
  repeated string refs = 1;
  int64  dx = 2;              // nm
  int64  dy = 3;              // nm
  int32  drot_decideg = 4;    // rotation delta around each footprint's own anchor
  bool   flip = 5;            // move to the other side (F.Cu <-> B.Cu), mirrored left-right
                              // around the footprint's own anchor: pads, padstacks, silk,
                              // fab and courtyard layers swap, geometry is mirrored
  bool   group_pivot = 6;     // rotate / flip the refs as one group around the centre of
                              // their combined body box (as the editor does for a selection)
                              // instead of each around its own anchor
}

message MoveResult
{
  string ref = 1;
  Point  pos = 2;
  int32  rot_decideg = 3;
  bool   back = 4;            // on B.Cu
}

message MoveResponse
{
  repeated MoveResult   moved   = 1;
  repeated string       missing = 2;   // refs that were not found
  int64                 elapsed_us = 3;   // commit incl. connectivity update
  int32                 unconnected = 4;  // unrouted connections, excluding ratsnest_pending nets
  repeated DrcViolation drc = 5;          // local DRC around the moved footprints
  int64                 drc_us = 6;
  repeated string       ratsnest_pending = 7;  // large nets whose ratsnest is deferred
  string                history_label = 8;     // undo label recorded for this edit
  repeated string       removed = 9;           // refs deleted by this edit
  repeated string       added   = 10;          // refs added by this edit
  string                source  = 11;          // AddFootprint: where the footprint came from
  repeated string       created_nets = 12;     // AddFootprint: nets that did not exist before
  int32                 tracks_removed = 14;   // DeleteTracks: tracks / arcs / vias removed
  int32                 tracks_locked  = 15;   // DeleteTracks: matched but locked, kept
  int32                 changed = 16;          // Undo/Redo of sync_pcb: footprints put back as they were
  repeated string       notes = 17;            // things to know (a reference the next sync puts back,
                                               // zone fills out of date after an undo ...)
  int32                 already_there = 13;    // Undo/Redo: footprints already in the target state
                                               // (undone / redone in the editor), left alone
}

// Remove footprints (and their pads from connectivity). Tracks and vias are left in place,
// as in the editor. Undoable: undo puts the same footprints back with the same ids and nets.
// Returns MoveResponse (removed, unconnected)
message DeleteFootprints
{
  repeated string refs = 1;
}

// Remove tracks, arcs and vias (the routing), e.g. before auto_place on a routed board.
// One of: all; nets (by name); region (any part of the track inside); refs (connected to a pad
// of these footprints). Locked ones stay unless include_locked. Undoable. Zones are not touched
// (refill_zones afterwards). Returns MoveResponse (tracks_removed, unconnected).
message DeleteTracks
{
  bool            all            = 1;
  repeated string nets           = 2;
  Point           region_min     = 3;
  Point           region_max     = 4;
  repeated string refs           = 5;
  bool            include_locked = 6;
  bool            keep_vias      = 7;
}

// Place a new footprint in memory.
//
// The footprint is taken from, in order:
//   - `like`: a copy of the footprint already on the board with that reference;
//   - `lib_id` ("Nickname:Name"): the footprint library table, then the directories in
//     KICADD_FOOTPRINT_DIRS (colon separated, each holding Nickname.pretty/) and
//     /usr/share/kicad/footprints, then a footprint on the board that uses the same lib_id.
//
// `ref` may end in "?" (e.g. "R?") to take the next free number; empty means the prefix of
// `like`. Pads get nets by pad number; nets that don't exist yet are created and listed in
// created_nets. Pads not in `nets` stay unconnected (a `like` copy keeps none of its nets).
// Returns MoveResponse (added, moved, source, local DRC of the new footprint)
message AddFootprint
{
  string              lib_id = 1;
  string              like   = 2;
  string              ref    = 3;
  string              value  = 4;
  Point               pos    = 5;
  int32               rot_decideg = 6;
  bool                back   = 7;          // place on B.Cu
  map<string, string> nets   = 8;          // pad number -> net name
  string              lcsc   = 9;          // LCSC part number (e.g. "C8734"): fetched, converted,
                                           // saved to the project library LCSC; lib_id unused
}

// ---------------------------------------------------------------------------
// LCSC parts (M4a): an LCSC number -> a KiCad footprint in the project library LCSC
// (${KIPRJMOD}/lcsc.pretty), from the JLCEDA/EasyEDA Official Library, cached per user.

// M5b: Update PCB from Schematic, headless. The schematic is read from its saved file (the
// MCP tool saves it first). New footprints land outside the board (KiCad spreads them near the
// origin) until they are placed (auto_place).
// Returns SyncFromSchematicResponse
message SyncFromSchematic
{
  bool delete_extra      = 1;   // remove footprints the schematic no longer has
  bool update_footprints = 2;   // replace footprints whose library link changed
  bool dry_run           = 3;
}

message SyncFromSchematicResponse
{
  int32  added    = 1;
  int32  errors   = 2;
  int32  warnings = 3;
  string report   = 4;
  repeated string new_refs = 5;
  int32  footprints = 6;        // on the board afterwards
  int32  nets       = 7;
  bool   from_editor = 8;       // the netlist came from the open Schematic Editor (unsaved edits too)
  string history_label = 9;     // the agent's undo entry for it (empty: nothing changed)
}

// M5c: automatic placement (src/pcb/kicadd_autoplace.h). Moves the chosen parts inside the
// board outline: connection-driven, courtyards apart, one undoable edit.
// Returns AutoPlaceResponse
message AutoPlace
{
  repeated string refs  = 1;   // these parts; default: the parts outside the board outline
  bool   all            = 2;   // every unlocked part
  int64  spacing        = 3;   // courtyard to courtyard, nm (0 = 0.25 mm)
  int64  edge           = 4;   // courtyard to board edge, nm (0 = 0.5 mm)
  bool   no_rotate      = 5;
  repeated string fixed = 6;   // keep these where they are (in addition to locked parts)
  repeated PartGroup groups = 7; // functional blocks kept together; default: the footprints' "Block" field
  bool   no_groups      = 8;   // ignore blocks
  bool   groups_from_sheets = 9;  // the schematic sheets are the blocks
  double group_weight   = 10;  // pull to the block's centre, 1 = like a two-pin net (0 = 3)
  repeated string back  = 11;  // these parts may go to the bottom side ("C*", "R12"; SMD only)
  bool   back_decaps    = 12;  // decoupling caps (2 pads, one on ground, at an IC pin) may go to the bottom, under it
  bool   measure_only   = 13;  // move nothing: report the current wire length, mixing, decoupling distance

  // Rules (refs may be patterns: "J*"). Edge, region and rotation are hard (a part that can't
  // meet them is not placed); near is kept with a strong pull and reported when broken.
  repeated EdgeRule     edge_rules     = 14;
  repeated RegionRule   region_rules   = 15;
  repeated NearRule     near_rules     = 16;
  repeated RotationRule rotation_rules = 17;

  // Seconds for improving the wire length once every part has a legal spot (0 = 10 s, < 0 = no
  // limit). Running out leaves a legal placement, only a less improved one.
  double time_limit     = 18;

  // Run on another thread: the answer comes at once with running = true; then ask
  // AutoPlaceStatus until running is false (the result is applied on that call). Other edits
  // are refused as busy meanwhile; if the board changes anyway, nothing is moved.
  bool   background     = 19;

  // Apply the result even when it is worse than the parts' current places (every movable part
  // already on the board, not overlapping): by default those are kept and nothing moves.
  bool   force          = 20;
}

// Returns AutoPlaceResponse: running (progress), or the finished result, applied now
message AutoPlaceStatus
{
  bool cancel = 1;     // stop the background run; nothing is moved
}

message EdgeRule
{
  string ref  = 1;
  string side = 2;     // left, right, top, bottom, any: its courtyard at that board edge
}

message RegionRule
{
  string ref = 1;
  Point  min = 2;      // board coordinates, nm: the courtyard stays inside
  Point  max = 3;
}

message NearRule
{
  repeated string refs = 1;
  int64  max_distance  = 2;   // nm, between the centres of the parts' pads
}

message RotationRule
{
  string ref     = 1;
  int32  degrees = 2;  // 0, 90, 180, 270
}

message PartGroup
{
  string name = 1;
  repeated string refs = 2;
}

message AutoPlaceResponse
{
  int32  moved          = 1;
  repeated string unplaced = 2;   // no room on the board
  double hpwl_before_mm = 3;      // half-perimeter wire length, all nets
  double hpwl_after_mm  = 4;
  repeated string refs  = 5;      // the parts it placed
  MoveResponse edit     = 6;      // positions after, history label
  repeated string skipped = 7;    // asked for but kept: locked, back side, not at 0/90/180/270
  int32  groups         = 8;      // blocks the parts were kept together in (0: none)
  string group_source   = 9;      // "request", "Block field", "sheets"
  int32  mixed          = 10;     // placed parts whose nearest neighbour is in another block
  int32  mixed_before   = 11;     // the same before (parts on the board)
  int32  on_back        = 12;     // placed parts on the bottom side
  int32  flipped        = 13;     // of the placed parts, how many changed side
  int32  decaps         = 14;     // placed small passives tied to an IC pin (decaps, pull-ups)
  double decap_before_mm = 15;    // their mean pad-to-pin distance (those on the board before)
  double decap_after_mm = 16;
  repeated string rule_violations = 17;   // near rules not met
  bool   timed_out      = 18;     // stopped improving at time_limit
  int32  refine_passes  = 19;     // improving passes run
  double seconds        = 20;     // placer run time
  int32  track_obstacles = 21;    // tracks and vias on the board: the parts keep clear of them
  bool   running        = 22;     // background: still running (ask AutoPlaceStatus again)
  bool   cancelled      = 23;     // stopped by AutoPlaceStatus cancel: nothing moved
  string progress       = 24;     // while running: "placing, 30/62 parts", "improving, 2 pass(es) done"
  bool   kept_current   = 25;     // the current placement was better (shorter, or all parts fit):
                                  // nothing moved; hpwl_after_mm is what the new one would have had
  int32  zones          = 26;     // copper zones on the board: refill them before run_drc
}

message FetchLcsc
{
  string lcsc    = 1;      // "C8734"
  bool   refresh = 2;      // ask the network even when cached
}

message LcscPad
{
  string number = 1;
  Point  pos    = 2;       // relative to the footprint origin, nm
  Point  size   = 3;       // nm
  bool   tht    = 4;
}

message FetchLcscResponse
{
  string lcsc        = 1;
  string title       = 2;  // part name, e.g. STM32F103C8T6
  string package     = 3;  // footprint name
  string lib_id      = 4;  // "LCSC:<package>" when saved to the project library
  string file        = 5;  // .kicad_mod written ("" when the board has no folder yet)
  bool   from_cache  = 6;
  bool   registered  = 7;  // the LCSC row was just added to the project fp-lib-table
  string datasheet   = 8;
  string attribution = 9;
  string note        = 10;
  Point  courtyard   = 11; // courtyard size, nm
  repeated LcscPad pads = 12;
  string description = 13;
  LcscSymbol symbol  = 14; // M4b: the schematic symbol, when it could be saved
  LcscStock  stock   = 15; // M4c: catalogue data from the same answer
}

message LcscStock
{
  int64  stock     = 1;    // LCSC stock; -1 unknown
  double price_usd = 2;    // unit price at min_qty, USD; < 0 unknown
  int32  min_qty   = 3;
  string url       = 4;    // LCSC product page
  bool   jlc_smt   = 5;    // JLCPCB assembly can place it
  string jlc_class = 6;    // "Basic Part" / "Extended Part"
  string as_of     = 7;    // date of the data (when fetched or cached), not live
}

message LcscSymbol
{
  string lib_id     = 1;   // "LCSC:<symbol>"
  string file       = 2;   // the project's lcsc.kicad_sym
  string reference  = 3;   // "U", "R", ...
  int32  units      = 4;
  repeated string pins = 5;          // pin numbers
  bool   registered = 6;   // the LCSC row was just added to the project sym-lib-table
  repeated string pins_without_pad = 7;   // symbol pins the footprint has no pad for
  repeated string pads_without_pin = 8;   // numbered footprint pads no symbol pin uses
}

// ---------------------------------------------------------------------------
// Local (incremental) DRC

enum DrcType
{
  DT_UNKNOWN           = 0;
  DT_CLEARANCE         = 1;   // copper-to-copper closer than the clearance rule
  DT_SHORT             = 2;   // different-net copper touching
  DT_HOLE_CLEARANCE    = 3;   // copper too close to a hole on a layer where it isn't flashed
  DT_COURTYARD_OVERLAP = 4;
  DT_EDGE_CLEARANCE    = 5;   // copper closer to Edge.Cuts / Margin than copper_edge_clearance
  DT_COPPER_OUTSIDE_BOARD = 6;  // copper entirely outside the board outline (a == b)
  DT_HOLE_TO_HOLE      = 7;   // two drilled holes closer than hole_to_hole (route / fanout vias)
}

message DrcViolation
{
  DrcType type     = 1;
  string  a        = 2;   // handle of the moved-side item, e.g. "U5.3"
  string  b        = 3;   // handle of the other item, e.g. "C12.1" or short track id
  string  net_a    = 4;
  string  net_b    = 5;
  string  layer    = 6;
  int64   required = 7;   // nm (0 for courtyard)
  int64   actual   = 8;   // nm
  Point   pos      = 9;
  string  a_id     = 10;  // full KIIDs, for cross-referencing with upstream API / markers
  string  b_id     = 11;
}

// Run local DRC for the given footprints against their neighbourhood.
// Checks: copper clearance / shorts / hole clearance (pads vs pads, tracks, arcs, vias),
// courtyard overlap, copper vs board edge (Edge.Cuts and Margin) and copper outside the board.
// Not checked: zone fills (stale until refill), silk, text.
// Returns LocalDrcResponse
message CheckLocalDrc
{
  repeated string refs = 1;
}

message LocalDrcResponse
{
  repeated DrcViolation drc     = 1;
  repeated string       missing = 2;
  int64                 drc_us  = 3;
}

// ---------------------------------------------------------------------------
// Diagnostics

// Snapshot incremental connectivity state, rebuild connectivity from scratch, and diff.
// Leaves the board with the freshly rebuilt state.
// Returns VerifyConnectivityResponse
message VerifyConnectivity {}

message VerifyConnectivityResponse
{
  int32           items_checked      = 1;
  int32           nets_checked       = 2;
  repeated string item_mismatches    = 3;   // "<handle>: <net before> -> <net after>"
  repeated string net_mismatches     = 4;   // "<net>: <edges before> -> <edges after>"
  int32           unconnected_before = 5;
  int32           unconnected_after  = 6;
  int64           rebuild_us         = 7;
}

// Order-independent fingerprint of derived board state, for A/B equivalence tests.
// Returns StateDigestResponse
message GetStateDigest {}

message StateDigestResponse
{
  uint64 net_hash       = 1;   // (item KIID, net code) for pads, tracks, vias, zones
  uint64 ratsnest_hash  = 2;   // (net, unrouted edge count) per net
  uint64 teardrop_hash  = 3;   // teardrop zones: KIID, priority, outline vertices
  int32  teardrops      = 4;
  int32  unconnected    = 5;
}

// ---------------------------------------------------------------------------
// Lazy ratsnest for large nets
//
// During MoveDelta, nets with more than min_pads pads skip ratsnest recomputation (net
// propagation still runs). Their ratsnest is rebuilt on FlushRatsnest, or automatically
// the first time anything reads ratsnest data (full DRC, upstream API, GetStateDigest).

// Returns RatsnestDeferralResponse
message SetRatsnestDeferral
{
  bool  enabled  = 1;
  int32 min_pads = 2;   // defer nets with more pads than this; 0 = keep current (default 50)
}

message RatsnestDeferralResponse
{
  bool  enabled  = 1;
  int32 min_pads = 2;
}

// Rebuild all deferred nets now. Returns FlushRatsnestResponse
message FlushRatsnest {}

message FlushRatsnestResponse
{
  int32 nets_flushed = 1;
  int32 unconnected  = 2;   // complete, board-wide
  int64 elapsed_us   = 3;
}

// ---------------------------------------------------------------------------------------------
// History (undo / redo)
//
// Headless KiCad commits keep no undo list (that lives in the editor frame), so KiCadD keeps
// its own: every KiCadD edit records the before/after state of what it touched. Undo/redo
// restore those states as new commits. Edits made through other API commands aren't recorded.

message Undo {}
message Redo {}
message GetHistory {}

// Returns HistoryResponse (Undo / Redo / GetHistory)
message HistoryResponse
{
  bool            ok       = 1;     // false: nothing to undo/redo
  string          label    = 2;     // what was undone / redone
  MoveResponse    result   = 3;     // positions, unconnected, local DRC after undo/redo
  repeated string undo     = 4;     // labels, oldest first
  repeated string redo     = 5;     // labels, next redo last
  bool            modified = 6;     // board differs from the file on disk
}

// ---------------------------------------------------------------------------------------------
// Item description (e.g. to turn DRC marker KIIDs into readable handles)

// Returns DescribeItemsResponse
message DescribeItems
{
  repeated string ids = 1;   // full KIIDs
}

message DescribedItem
{
  string   id     = 1;
  string   handle = 2;   // "U5", "U5.3", short id for tracks/vias, "zone:<net>", "edge", ...
  string   net    = 3;
  ItemKind kind   = 4;
}

message DescribeItemsResponse
{
  repeated DescribedItem items = 1;   // same order as the request; empty handle if unknown
}

// ---------------------------------------------------------------------------------------------
// Fabrication output for JLCPCB (or any fab): Gerbers (Protel extensions, X2, job file),
// Excellon drill (mm, PTH and NPTH files), a zip of those two (the upload), BOM and CPL as CSV
// in JLCPCB's columns. From the board in memory (unsaved edits included); zones are plotted as
// they are filled (refill them first). Returns ExportFabResponse
message ExportFab
{
  string dir        = 1;     // default <project dir>/fab (created)
  bool   no_zip     = 2;
  bool   check_only = 3;     // write nothing: only problems is filled
}

message ExportFabResponse
{
  string dir        = 1;
  repeated string files = 2;    // file names in dir
  string zip        = 3;        // gerbers + drill, for the upload
  string bom        = 4;
  string cpl        = 5;
  int32  bom_lines  = 6;
  int32  bom_parts  = 7;
  int32  placed     = 8;        // parts in the CPL
  repeated string no_lcsc = 9;  // BOM lines without an LCSC number: "C3 C4 (100n, C_0402)"
  repeated string notes   = 10;
  int32  layers     = 11;       // Gerber files
  repeated string problems = 12;   // what would go wrong at the assembler: a reference twice, parts off the board
}

// ---------------------------------------------------------------------------------------------
// A picture of the board in memory for the agent to look at: KiCad's own plot of the layers
// (copper with pads and filled zones, silkscreen, fab, ...) in colour, at a chosen size, of the
// whole board or a part of it, with what to look at marked: parts framed and labelled, nets
// drawn bright, the unrouted connections, a millimetre ruler on the edges. Returns RenderBoardResponse
message RenderBoard
{
  repeated string layers   = 1;   // layer names ("F.Cu", "F.SilkS") or sets: front (default), back,
                                  // copper, silk, fab, assembly
  repeated string refs     = 2;   // framed and labelled
  repeated string nets     = 3;   // drawn bright
  Point  area_min          = 4;   // nm; both or neither (default: the board, or around refs / nets
  Point  area_max          = 5;   // when zoom)
  bool   zoom              = 6;   // to the refs / nets (with a margin)
  int32  size              = 7;   // pixels on the long side (default 1200, 200..4000)
  bool   no_ratsnest       = 8;
  bool   labels            = 9;   // every part's reference in the middle of it
  string path              = 10;  // also write the PNG there
  bool   back              = 11;  // seen from below (mirrored), back layers on top
  double margin            = 12;  // mm around a zoom (default 3)
}

message RenderBoardResponse
{
  bytes  png       = 1;
  int32  width     = 2;
  int32  height    = 3;
  double mm_per_px = 4;
  Point  origin    = 5;    // nm: the top-left corner (top-right when back)
  Point  extent    = 6;    // nm: the bottom-right corner
  repeated string layers  = 7;    // what was plotted, bottom first
  repeated string missing = 8;    // refs / nets / layers not found
  int32  unrouted  = 9;    // ratsnest lines drawn
  string path      = 10;
}

// ---------------------------------------------------------------------------------------------
// Parts search by specification (two stages): KiCadD's parts index (JLCPCB parts in stock, from
// jlcparts' daily data, downloaded once and refreshed weekly) narrows down by parameters, then the
// first few are checked live (EasyEDA: today's LCSC stock and JLCPCB assembly). Returns
// LcscSearchResponse
message LcscSearch
{
  string keyword     = 1;   // words in the description / part number / package ("AMS1117 3.3")
  string category    = 2;   // resistor, capacitor, inductor, or a JLCPCB category / subcategory word
  string value       = 3;   // "100nF", "10k", "4k7", "2.2uH"
  string package     = 4;   // "0402", "SOT-23"
  double tolerance   = 5;   // %, at most
  double voltage_min = 6;   // V, at least (rating)
  string dielectric  = 7;   // X7R, X5R, C0G
  bool   basic_only  = 8;
  int64  min_stock   = 9;   // default 1
  int32  limit       = 10;  // default 8, at most 50
  int32  live        = 11;  // how many of the first to check live (default 3, -1 none)
  bool   update      = 12;  // fetch the index again now
}

message LcscHit
{
  string lcsc         = 1;
  string mfr          = 2;   // manufacturer part number
  string manufacturer = 3;
  string package      = 4;
  string description  = 5;
  bool   basic        = 6;
  bool   preferred    = 7;   // "preferred extended": no extended-part fee at JLCPCB either
  int64  stock        = 8;   // JLCPCB stock on the index date
  double price        = 9;   // USD, first price break
  int64  live_stock   = 10;  // LCSC stock now, -1 not checked / unknown
  string live_class   = 11;  // "Basic Part" / "Extended Part" (now)
  bool   live_smt     = 12;  // JLCPCB can assemble it (now)
  string live_note    = 13;
}

message LcscSearchResponse
{
  repeated LcscHit hits = 1;
  int64  total      = 2;     // matches before limit
  string index_date = 3;
  string note       = 4;
}

// ---------------------------------------------------------------------------------------------
// A footprint made from a few numbers, for the common packages, saved to the project library
// "kicadd" (kicadd.pretty, added to fp-lib-table on first use). Pads from IPC-7351-like rules
// (toe / heel / side margins on nominal lead sizes); courtyard 0.25 mm (0.5 through-hole).
// Odd shapes stay with the Footprint Editor. Returns FpCreateResponse
message FpCreate
{
  string kind     = 1;   // chip, sot23, soic, so, qfn, qfp, header
  string size     = 2;   // chip: 0201 0402 0603 0805 1206 1210 2010 2512
  string prefix   = 3;   // chip: R, C, L, LED, D (name only)
  int32  pins     = 4;   // sot23: 3/5/6; soic/so: even; qfn/qfp: a multiple of 4; header: total
  double pitch    = 5;   // mm (soic 1.27; header 2.54)
  double body     = 6;   // qfn/qfp: square body side, mm; soic/so: body width (3.9 / 7.5)
  double span     = 7;   // so/qfp: lead tip to lead tip (default soic 6.0, qfp body + 2)
  double ep       = 8;   // qfn: exposed pad side, mm (0 none)
  int32  rows     = 9;   // header: 1 or 2
  string name     = 10;  // default a descriptive name ("SOIC-8_3.9mm_P1.27mm")
  bool   replace  = 11;
}

message FpCreateResponse
{
  string lib_id   = 1;   // "kicadd:SOIC-8_3.9mm_P1.27mm"
  string file     = 2;
  int32  pads     = 3;
  Point  courtyard = 4;  // nm
  bool   registered = 5;
  string note     = 6;
}

// Change footprints' fields and attributes on the board as one undoable edit (undo / redo).
// fields: name -> text; "Value" is the value, other names user fields (added hidden when
// missing); "Reference" renumbers the part (to one no other part has); remove: user fields to
// delete. The footprint is not changed here. A board made from a schematic gets its fields from
// it (sync_pcb): change them there. Returns MoveResponse (history_label; missing: refs not
// found; notes)
message FpFieldEdit
{
  string              ref    = 1;
  map<string, string> fields = 2;
  repeated string     remove = 3;
  optional bool dnp              = 4;
  optional bool exclude_from_bom = 5;
  optional bool exclude_from_pos = 6;
}

message FpSetFields
{
  repeated FpFieldEdit parts = 1;
}

// Design rules: net classes, net class assignments by net name pattern, the board's minimum
// constraints. Lengths in mm. GetRules returns RulesResponse.
message NetclassRule
{
  string name = 1;
  // a value < 0 in SetRules: unset (taken from the Default class); not given: left as is
  optional double clearance       = 2;
  optional double track_width     = 3;
  optional double via_diameter    = 4;
  optional double via_drill       = 5;
  optional double diff_pair_width = 6;
  optional double diff_pair_gap   = 7;
  int32 nets = 8;   // in RulesResponse: the nets in this class now
}

message NetclassAssign
{
  string pattern  = 1;   // a net name pattern: "+3V3", "/USB_*", regex "/D[+-]/"
  string netclass = 2;   // "" in SetRules: drop this pattern
}

message BoardConstraints
{
  optional double min_clearance         = 1;
  optional double min_track_width       = 2;
  optional double min_via_diameter      = 3;
  optional double min_through_drill     = 4;
  optional double min_annular_width     = 5;
  optional double hole_clearance        = 6;
  optional double hole_to_hole          = 7;
  optional double copper_edge_clearance = 8;
  optional double min_silk_text_height    = 9;
  optional double min_silk_text_thickness = 10;
}

message GetRules
{
}

// Change the rules as one undoable edit (undo / redo). classes: add or change (only the values
// given); remove_classes: drop (their patterns go too); assign: add / change / drop patterns.
// Returns RulesResponse
message SetRules
{
  repeated NetclassRule   classes        = 1;
  repeated string         remove_classes = 2;
  repeated NetclassAssign assign         = 3;
  BoardConstraints        constraints    = 4;
  string                  preset         = 5;   // a fab's process first ("jlcpcb_2layer"), then the rest
}

message RulesResponse
{
  repeated NetclassRule   classes       = 1;
  repeated NetclassAssign patterns      = 2;
  BoardConstraints        constraints   = 3;
  string                  history_label = 4;
  string                  note          = 5;   // preset: where its numbers come from
}

// Copper zones: list them, or change their settings as one undoable edit (undo / redo).
// Which zones: nets, layers, ids (from the list), or all; nothing to change: just the list.
// Lengths in mm. connection: solid, thermal, none, thermal_tht (thermal reliefs on through-hole
// pads only). The fill is not redone here (refill_zones; kicadd-mcp does it by default).
// Returns ZonesResponse
message ZoneInfo
{
  string id            = 1;
  string name          = 2;
  string net           = 3;
  repeated string layers = 4;
  int32  priority      = 5;
  double clearance     = 6;
  double min_width     = 7;
  string connection    = 8;
  double thermal_gap   = 9;
  double thermal_spoke = 10;
  bool   filled        = 11;
}

message Zones
{
  repeated string nets   = 1;
  repeated string layers = 2;
  repeated string ids    = 3;
  bool all               = 4;
  optional double clearance     = 5;
  optional double min_width     = 6;
  optional int32  priority      = 7;
  string          connection    = 8;
  optional double thermal_gap   = 9;
  optional double thermal_spoke = 10;
  ZoneCreate      create        = 11;   // a new zone instead (one undoable edit)
}

// Zones.create: a new copper zone (a pour), filled afterwards by kicadd-mcp. outline: the board
// outline (default) or points (mm).
message ZoneCreate
{
  string          net        = 1;   // "" : no net (an island of copper is rarely wanted)
  repeated string layers     = 2;   // default F.Cu and B.Cu (all copper layers: "all")
  repeated Point  outline    = 3;   // nm; empty: the board outline
  optional int32  priority   = 4;   // not given: 0, or above the bigger zones of other nets it lies in
  optional double clearance  = 5;   // mm; default the board's zone defaults
  optional double min_width  = 6;
  string          connection = 7;   // solid, thermal (default), none, thermal_tht
  string          name       = 8;
}

message ZonesResponse
{
  repeated ZoneInfo zones  = 1;   // the zones chosen (all when none was named), as they are now
  string history_label     = 2;
  int32  changed           = 3;
  repeated string notes    = 4;   // create: the priority chosen; zones of other nets it overlaps at
                                  // the same priority
}

// ---------------------------------------------------------------------------
// Board outline: Edge.Cuts drawn anew (the old board-level Edge.Cuts shapes go, footprints'
// stay), cut-outs, mounting holes. One undoable edit. Returns BoardOutlineResponse
message OutlineShape
{
  repeated double rect   = 1;   // [x0, y0, x1, y1] mm
  repeated double circle = 2;   // [cx, cy, diameter] mm
  double corner_radius   = 3;   // rect: mm
}

message MountingHole
{
  double x = 1;
  double y = 2;
  double diameter = 3;      // mm, the drill
  bool   plated   = 4;      // a plated hole with a ring (pad = 1.8 x drill), else NPTH
  string net      = 5;      // plated: e.g. GND
}

message BoardOutline
{
  OutlineShape          outline = 1;
  repeated OutlineShape cutouts = 2;
  repeated MountingHole holes   = 3;
  double hole_inset   = 4;    // > 0: holes at the 4 corners, this far in from the outline (mm)
  double hole_diameter = 5;   // with hole_inset (default 3.2, M3)
  bool   keep_old     = 6;    // keep the Edge.Cuts there are (add to them)
}

message BoardOutlineResponse
{
  double width  = 1;     // mm, the outline's bounding box
  double height = 2;
  double area   = 3;     // mm^2, inside the outline less the cut-outs
  int32  removed_shapes = 4;
  repeated string holes = 5;          // "H1 @x,y d3.2"
  repeated string outside = 6;        // parts now (partly) outside the outline, or on a cut-out
  string history_label = 7;
  repeated string problems = 8;       // holes left out (one is there already), holes on parts / tracks,
                                      // tracks a cut-out cuts or the outline leaves outside
}

// The board's layers and stackup: no change asked: just what it is. Changing the copper layer
// count makes the stackup anew (like Board Setup's default), with the thickness and copper
// weights given (else kept). One undoable edit. Returns BoardSetupResponse
message BoardSetup
{
  optional int32  copper_layers = 1;
  optional double thickness     = 2;   // mm
  optional double outer_copper_oz = 3;
  optional double inner_copper_oz = 4;
  optional string stackup       = 5;   // a fab's stackup by name ("JLC04161H-7628"); "list": the names
}

message BoardSetupResponse
{
  int32  copper_layers = 1;
  double thickness     = 2;   // mm
  repeated string stackup = 3;   // top to bottom
  string history_label = 4;
  string note          = 5;   // where a fab stackup's numbers come from; or the names there are
}

// ---------------------------------------------------------------------------
// Routing: tracks drawn by KiCad's router (walkaround: around obstacles, never moving existing
// copper; the board's clearance, keepout and edge rules). Not an autorouter: the caller says
// what to connect and through which points / vias.

message RouteEnd
{
  string pad = 1;        // "U1.5"
  Point  pos = 2;        // or a point: on a track / via of the net (from), or anywhere (to)
}

message RouteStop
{
  Point  pos    = 1;
  string via_to = 2;     // a via here, then on to this layer ("B.Cu"; "other": the end's layer,
                         // else the other outer layer); empty: a waypoint
}

// One connection, one undoable edit. to: omitted: the nearest unrouted connection of `from`
// (its ratsnest). Returns RouteResponse
message RouteTrack
{
  RouteEnd           from    = 1;
  RouteEnd           to      = 2;
  repeated RouteStop stops   = 3;
  string             layer   = 4;   // empty: the start's (SMD pad, track), else the end's, else F.Cu
  int64              width   = 5;   // nm; 0: the net class / rules
  bool               dry_run = 6;
}

message RouteResult
{
  string from       = 1;
  string to         = 2;
  bool   ok         = 3;
  string error      = 4;
  string net        = 5;
  string layer      = 6;
  int64  width      = 7;
  int64  length     = 8;    // nm along the new tracks
  int64  direct     = 9;    // nm in straight lines through the stops
  int32  segments   = 10;
  int32  vias       = 11;
  int64  min_gap    = 12;   // nm to the nearest other-net copper / edge; -1: none within 5 mm
  string gap_to     = 13;
  Point  reached    = 14;   // failed: how far it got
  string blocked_by = 16;
  Point  blocked_at = 17;
}

message RouteResponse
{
  repeated RouteResult  results       = 1;
  repeated DrcViolation drc           = 2;   // of the new tracks (clearance, edge)
  int32                 unconnected   = 3;
  string                history_label = 4;
  bool                  dry_run       = 5;
  int32                 tracks_added  = 6;
  int32                 vias_added    = 7;
}

// Route the unrouted connections of refs / nets up to max_length, shortest first, each as
// `route` would (THT-to-THT ones on F.Cu, then B.Cu if blocked, unless layer is given).
// All of it one undoable edit. Returns RouteResponse (one result per connection tried).
message RouteShort
{
  repeated string refs       = 1;
  repeated string nets       = 2;
  int64           max_length = 3;   // nm, straight-line length of the connection; 0: any
  string          layer      = 4;
  bool            dry_run    = 5;
}

// Fan out SMD pads to a copper zone of their net on another layer: a short track and a via
// next to each pad, the via inside that zone. Through-hole pads are skipped (they reach every
// layer). One undoable edit. Returns FanoutResponse
message Fanout
{
  repeated string refs     = 1;   // empty: every footprint with a pad on these nets
  repeated string nets     = 2;   // required
  string          layer    = 3;   // the zone's layer; empty: any other layer with a zone of the net
  bool            dry_run  = 4;
}

message FanoutResponse
{
  RouteResponse   routes       = 1;   // one result per pad fanned out (or failed)
  int32           skipped_tht  = 2;
  int32           skipped_done = 3;   // pads already reaching the zone's layer through a via / track
  repeated string no_zone      = 4;   // "VCC: R22.1, JP1.1": a net with no zone on another layer, its pads left alone; "X (no such net)"
}

// Stitching vias: through vias of one net (GND) on a grid, each inside the net's filled copper
// on two or more layers, clear of other-net copper, holes, pads, the edge and (unless
// under_parts) the parts' courtyards; then one via in each island of the net's copper left
// without any (dead copper joined to the rest). The net class's via size. One undoable edit;
// the zones are refilled. Returns StitchViasResponse
message StitchVias
{
  string net         = 1;    // default GND
  int64  spacing     = 2;    // nm between grid points (default 5 mm)
  Point  area_min    = 3;    // nm; both or neither (default the board)
  Point  area_max    = 4;
  bool   under_parts = 5;    // also inside courtyards
  bool   no_islands  = 6;    // the grid only
  bool   dry_run     = 7;
  int32  max         = 8;    // at most this many vias (default 500)
}

message StitchViasResponse
{
  int32  vias_added      = 1;
  int32  grid_points     = 2;   // grid points inside the area
  int32  in_copper       = 3;   // of them inside the net's copper on 2+ layers
  int32  near_existing   = 4;   // left out: a via or hole of the net already near
  int32  blocked         = 5;   // left out: a pad, track, part or rule in the way
  int32  islands_joined  = 6;
  repeated string islands_left = 7;   // "B.Cu @120.5,40.2 (3.1 mm²)"
  repeated string layers = 8;   // the layers with the net's copper
  int32  via_diameter    = 9;   // nm
  int32  via_drill       = 10;
  string history_label   = 11;
  int32  unconnected     = 12;
  bool   dry_run         = 13;
  repeated string notes  = 14;
}

// Teardrops (KiCad's own: copper zones that widen a track into its pad or via) on vias and
// round through-hole pads (and SMD pads with smd), or remove them. They follow the parts and
// tracks from then on, as in the editor. One undoable edit. Returns TeardropsResponse
message Teardrops
{
  bool            remove  = 1;
  bool            no_vias = 2;
  bool            no_pth  = 3;
  bool            smd     = 4;
  repeated string nets    = 5;   // only these nets
  repeated string refs    = 6;   // only these parts' pads (and no vias unless nets too)
  bool            dry_run = 7;
}

message TeardropsResponse
{
  int32  changed       = 1;   // pads / vias switched on (off)
  int32  already       = 2;   // already so
  int32  before        = 3;   // teardrops on the board before / after
  int32  after         = 4;
  string history_label = 5;
  repeated string missing = 6;
  bool   dry_run       = 7;
}
