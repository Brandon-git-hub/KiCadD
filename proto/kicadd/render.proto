/*
 * KiCadD render / change-feed API (Phase 3: remote 2D view).
 *
 * The daemon journals every board change (via BOARD_LISTENER) under a monotonically
 * increasing revision. A view takes a snapshot, then polls GetChanges(since = its revision)
 * and applies upserts / removals. If it falls too far behind, `resync` asks for a snapshot.
 *
 * Coordinates: integer nm, like the rest of the KiCadD API.
 *
 * This file is part of KiCadD and is licensed GPL-3.0-or-later, like KiCad.
 */

syntax = "proto3";

package kicadd.render;

import "kicadd/board.proto";

enum PadShape
{
  PS_CIRCLE    = 0;
  PS_RECT      = 1;
  PS_OVAL      = 2;
  PS_ROUNDRECT = 3;
  PS_POLY      = 4;   // trapezoid, chamfered, custom: see `poly`
}

enum PadSide
{
  SIDE_FRONT   = 0;
  SIDE_BACK    = 1;
  SIDE_THROUGH = 2;
}

message Polyline
{
  repeated sint64 xy = 1;   // x0, y0, x1, y1, ...  (closed)
}

message Pad
{
  string   number    = 1;
  string   net       = 2;
  PadShape shape     = 3;
  PadSide  side      = 4;
  kicadd.board.Point pos  = 5;
  kicadd.board.Point size = 6;
  int32    rot_decideg = 7;
  float    rr_ratio  = 8;     // roundrect radius / min(size)
  int32    drill     = 9;     // 0 = none
  Polyline poly      = 10;    // PS_POLY only, absolute coordinates
}

// Silkscreen / fab artwork (lines, arcs, circles, polygons and text in KiCad's own font),
// already flattened to absolute coordinates.
message Graphic
{
  string          layer  = 1;   // "F.SilkS", "B.SilkS", "F.Fab", "B.Fab"
  int32           width  = 2;   // stroke width (nm); 0 for a plain filled polygon
  bool            filled = 3;   // closed polygon to fill; otherwise an open polyline to stroke
  repeated sint64 xy     = 4;   // x0, y0, x1, y1, ...
}

message Footprint
{
  string   id    = 1;
  string   ref   = 2;
  string   value = 3;
  bool     back  = 4;
  kicadd.board.Point pos = 5;
  int32    rot_decideg = 6;
  bool     locked = 7;
  repeated Pad pads = 8;
  Polyline courtyard = 9;      // first outline of the courtyard on its side, may be empty
  kicadd.board.Point bbox_min = 10;   // body, no text
  kicadd.board.Point bbox_max = 11;
  repeated Graphic gfx = 12;   // silk / fab graphics and visible text of the footprint
}

message Track
{
  string id    = 1;
  string layer = 2;
  string net   = 3;
  kicadd.board.Point a = 4;
  kicadd.board.Point b = 5;
  int32  width = 6;
  bool   arc   = 7;
  kicadd.board.Point mid = 8;   // arcs only
}

message Via
{
  string id    = 1;
  string net   = 2;
  kicadd.board.Point pos = 3;
  int32  diameter = 4;
  int32  drill    = 5;
}

message Zone
{
  string   id    = 1;
  string   net   = 2;
  repeated string layers = 3;
  repeated Polyline outlines = 4;   // zone outline (not fill)
  bool     keepout = 5;
}

message LayerInfo
{
  string name = 1;
  bool   copper = 2;
  int32  order = 3;   // stack order, front = 0
}

message RenderItems
{
  repeated Footprint footprints = 1;
  repeated Track     tracks     = 2;
  repeated Via       vias       = 3;
  repeated Zone      zones      = 4;
}

// Returns RenderSnapshot
message GetRenderSnapshot
{
  bool skip_art = 1;   // leave out silk / fab graphics (fetch them with GetArt when shown)
}

message RenderSnapshot
{
  uint64            revision = 1;
  string            file     = 2;
  repeated LayerInfo layers  = 3;
  repeated Polyline outline  = 4;   // board edge polygons (outer outlines and holes)
  RenderItems       items    = 5;
  repeated Graphic  drawings = 6;   // board-level silk / fab artwork (not journalled)
}

// Silk / fab graphics of every footprint plus the board's own artwork, for some layers.
// Footprints changed later arrive with their graphics in RenderChanges.
// Returns Art
message GetArt
{
  repeated string layers = 1;   // "F.SilkS", "B.SilkS", "F.Fab", "B.Fab"; empty = all
}

message FootprintArt
{
  string           id  = 1;
  repeated Graphic gfx = 2;
}

message Art
{
  uint64                revision   = 1;
  repeated string       layers     = 2;
  repeated FootprintArt footprints = 3;
  repeated Graphic      drawings   = 4;
}

// Returns RenderChanges
message GetChanges
{
  uint64 since = 1;
}

message RenderChanges
{
  uint64          revision = 1;
  bool            resync   = 2;     // journal no longer covers `since`: take a snapshot
  RenderItems     upsert   = 3;     // current state of every item changed since `since`
  repeated string removed  = 4;     // ids of items deleted since `since`
}

// Unrouted connections for display.
// Without `flush`, large nets whose ratsnest is deferred (see SetRatsnestDeferral) are
// listed in `pending` and have no edges; with `flush` they are rebuilt first.
// Returns Ratsnest
message GetRatsnest
{
  bool flush = 1;
}

message Ratsnest
{
  repeated sint64 xy      = 1;   // x1, y1, x2, y2 per edge
  repeated int32  net     = 2;   // index into `nets`, one per edge
  repeated string nets    = 3;
  repeated string pending = 4;
  int32           unconnected = 5;
}

// Copper fill of zones (what the board actually has, not the zone outline).
// Fills go stale when parts move until the zones are refilled (upstream RefillZones).
// Returns ZoneFills
message GetZoneFills
{
  repeated string ids = 1;   // zone ids; empty = all filled copper zones
}

message FillPoly
{
  Polyline          outline = 1;
  repeated Polyline holes   = 2;
}

message ZoneFill
{
  string            id    = 1;
  string            net   = 2;
  string            layer = 3;
  repeated FillPoly polys = 4;
}

message ZoneFills
{
  repeated ZoneFill fills = 1;
}
